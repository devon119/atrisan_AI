name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r src\requirements.txt

      - name: Set build environment
        shell: pwsh
        run: |
          $pythonPath = python -c "import sys; print(sys.prefix)"
          $qtTransl   = "$pythonPath\Lib\site-packages\PyQt6\Qt6\translations"
          echo "PYTHON_PATH=$pythonPath"  >> $env:GITHUB_ENV
          echo "PYQT=6"                   >> $env:GITHUB_ENV
          echo "QT_TRANSL=$qtTransl"      >> $env:GITHUB_ENV

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Download VC Redist
        shell: pwsh
        run: |
          curl -L "https://aka.ms/vs/17/release/vc_redist.x64.exe" -o "$env:GITHUB_WORKSPACE\vc_redist.x64.exe"

      - name: Generate version info
        working-directory: src
        shell: pwsh
        run: |
          $ver = python -c "import artisanlib; print(artisanlib.__version__)"
          $bld = python -c "import artisanlib; print(artisanlib.__build__)"
          create-version-file version-metadata.yml --outfile version_info-win.txt --version "$ver.$bld"

      - name: Build with PyInstaller
        working-directory: src
        run: pyinstaller --noconfirm --log-level=WARN artisan-win.spec

      - name: Build installer with NSIS
        working-directory: src
        shell: pwsh
        run: |
          $ver = python -c "import artisanlib; print(artisanlib.__version__)"
          $bld = python -c "import artisanlib; print(artisanlib.__build__)"
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VERSION=$ver /DPRODUCT_BUILD=$bld setup-install3-pi.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: artisan-win-setup
          path: src\artisan-win*setup.exe
          retention-days: 30
